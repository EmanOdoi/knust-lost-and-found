services:
  - type: web
    name: knust-lostfound-api
    runtime: node
    rootDir: backend
    # SQLite needs a persistent disk to retain accounts after restarts.
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 4000
      - key: DATABASE_PATH
        value: /var/data/lostfound.db
    disk:
      name: lostfound-data
      mountPath: /var/data
      sizeGB: 1
